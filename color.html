/* 有程式錯誤時顯示提示，不會整頁卡住沒反應 */
function showErr(e) {
  if (document.getElementById("errBox")) return;
  const d = document.createElement("div"); d.id = "errBox";
  d.style.cssText = "position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:9999;max-width:560px;background:#fff;border:2px solid #E53935;border-radius:12px;padding:14px 18px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:15px;line-height:1.6";
  d.innerHTML = "<b style='color:#E53935'>系統載入發生錯誤</b><br>通常是瀏覽器還留著舊版檔案。請按 <b>Ctrl＋F5</b>（Mac：Cmd＋Shift＋R）強制重新整理；還是不行就請老師確認 GitHub 上的檔案都已更新。<br><small style='color:#888'>錯誤訊息：" + String(e.message || "").replace(/</g, "&lt;") + "</small><br><button style='margin-top:8px;padding:6px 14px;border-radius:8px;border:0;background:#3B7DD8;color:#fff;cursor:pointer' onclick='location.replace(location.pathname+\"?r=\"+Date.now())'>重新載入</button>";
  (document.body || document.documentElement).appendChild(d);
}
window.addEventListener("error", e => showErr(e));
window.addEventListener("unhandledrejection", e => showErr({ message: (e.reason && e.reason.message) || String(e.reason) }));
</script>

<script>
/* ---------------- 色彩工具 ---------------- */
const hex2rgb = h => { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(x => x + x).join(""); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
const rgb2hex = a => "#" + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("").toUpperCase();
const mix = (a, b, t) => rgb2hex(hex2rgb(a).map((v, i) => v + (hex2rgb(b)[i] - v) * t));
function rgb2hsl([r, g, b]) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0, l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; } return [h, s, l]; }
function hsl2hex(h, s, l) { h = ((h % 360) + 360) % 360; const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return rgb2hex([r, g, b].map(v => (v + m) * 255)); }
const rot = (hex, deg) => { const [h, s, l] = rgb2hsl(hex2rgb(hex)); return hsl2hex(h + deg, s, l); };
const vivid = (hex, deg) => { const [h, s] = rgb2hsl(hex2rgb(hex)); const hh = ((h + deg) % 360 + 360) % 360;
  const sat = hh > 260 && hh < 335 ? .5 : Math.min(Math.max(s, .62), .74);
  return hsl2hex(hh, sat, hh > 40 && hh < 75 ? .55 : hh > 75 && hh < 170 ? .44 : hh > 260 && hh < 335 ? .55 : .53); };
const light = (hex, l) => { const [h, s] = rgb2hsl(hex2rgb(hex)); return hsl2hex(h, s, l); };
function lum(hex) { return hex2rgb(hex).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; })
  .reduce((a, v, i) => a + v * [.2126, .7152, .0722][i], 0); }
const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); };
// 物件色當文字時，若和背景對比不夠，自動調深（或深色背景時調淺）到看得清楚
function readable(col, bg, need = 3.2) {
  let [h, sa, l] = rgb2hsl(hex2rgb(col)); const dark = lum(bg) > .4;
  let out = col;
  if (dark && contrast(col, bg) < need && h > 42 && h < 85) { h = 38; sa = Math.max(sa, .85); }   // 黃、黃綠調深會變土黃，改往深金黃調
  for (let i = 0; i < 40 && contrast(out, bg) < need; i++) { l = dark ? l - .02 : l + .02; out = hsl2hex(h, sa, Math.max(0, Math.min(1, l))); }
  return out;
}
const bestText = bg => contrast(bg, "#FFFFFF") >= contrast(bg, "#222222") ? "#FFFFFF" : "#222222";


/* ---------------- 狀態 ---------------- */
const NEUTRAL = { bg: "#FFFFFF", text: "#2B2B2B", text2: "#6B7280" };
// 配色方案＝背景與文字（bg, text, text2）＋物件色彩 colors[]（3～5 色，colors[0] 是主色，colors[acc] 是強調色）
function normPal(p) {
  p = { ...NEUTRAL, ...(p || {}) };
  let colors = Array.isArray(p.colors) && p.colors.length ? p.colors.slice() : [p.main || "#1F5BD8", p.sub || "#38BDF8", p.accent || "#E53935"];
  let acc = Array.isArray(p.colors) && p.colors.length ? p.acc : 2;
  if (acc === undefined || acc === null || acc >= colors.length) acc = colors.length - 1;
  const others = colors.filter((_, i) => i !== 0 && i !== acc);
  return { bg: p.bg, text: p.text, text2: p.text2, colors, acc, main: colors[0], accent: colors[acc], sub: others[0] || colors[0] };
}
let P = normPal(store("bp_palette") || { colors: ["#1F5BD8", "#38BDF8", "#E53935"], acc: 2 });
const savePal = () => { P = normPal(P); store("bp_palette", P); };
const colorName = (i, p = P) => i === 0 ? "主色" : i === p.acc ? "強調色" : "色彩 " + (i + 1);
const palAll = p => { p = normPal(p); return [p.bg, p.text, p.text2, ...p.colors]; };
let ST = store("bp_style") || { name: "", shape: "slant", font: "jh" };
let SAVED = store("bp_palettes") || [];
let TAB = "insp";
let PROG = null;           // 選手練習紀錄（母片養成進度用）
const ME = store("bp_me");
const derived = (p = P) => { p = normPal(p); return { ...p, soft: mix(p.main, p.bg, .88), ink: p.text, gray: p.text2 }; };

const SHAPES = [
  { k: "slant", n: "斜切", d: "平行四邊形、梯形，有速度感與現代感" },
  { k: "round", n: "圓弧", d: "正圓、圓角，親切、柔和" },
  { k: "block", n: "方塊", d: "矩形色塊、網格，穩重、條理分明" },
  { k: "line", n: "線條", d: "細線、留白，簡約、專業" }
];
const FONTS = [
  { k: "jh", n: "微軟正黑體＋Arial", d: "最穩，比賽電腦一定有", t: "'Microsoft JhengHei','Noto Sans TC',sans-serif", b: "'Microsoft JhengHei','Noto Sans TC',sans-serif" },
  { k: "jhs", n: "微軟正黑體＋Segoe UI", d: "英文數字較現代", t: "'Microsoft JhengHei','Noto Sans TC',sans-serif", b: "'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif" },
  { k: "kai", n: "標楷體標題＋微軟正黑體內文", d: "人文、文化類題目", t: "'DFKai-SB','BiauKai','KaiTi','Noto Serif CJK TC',serif", b: "'Microsoft JhengHei','Noto Sans TC',sans-serif" }
];
const fontOf = () => FONTS.find(f => f.k === ST.font) || FONTS[0];

const PRESETS = [
  { n: "清爽科技藍（3 色）", bg: "#FFFFFF", text: "#1F2933", text2: "#6B7280", colors: ["#1F5BD8", "#38BDF8", "#FF9F1C"], acc: 2 },
  { n: "每章一色（5 色）", bg: "#FFFFFF", text: "#222222", text2: "#6B7280", colors: ["#E53935", "#F07B2B", "#F2B632", "#3CC7A6", "#29A9E8"], acc: 0 },
  { n: "活力橘（3 色）", bg: "#FFFFFF", text: "#222222", text2: "#6B7280", colors: ["#F26B21", "#FFB703", "#1F8FCC"], acc: 2 },
  { n: "單一主色＋功能色（4 色）", bg: "#FFFFFF", text: "#1E293B", text2: "#64748B", colors: ["#1F5BD8", "#2BB673", "#F59E0B", "#D7263D"], acc: 3 },
  { n: "清新綠（4 色）", bg: "#FFFFFF", text: "#1F2D25", text2: "#64748B", colors: ["#2BB673", "#3B82F6", "#FFB400", "#F2545B"], acc: 3 },
  { n: "熱情紅（3 色）", bg: "#FFFFFF", text: "#222222", text2: "#6B7280", colors: ["#E63946", "#2A9D8F", "#F4A261"], acc: 2 },
  { n: "年輕紫粉（4 色）", bg: "#FFFFFF", text: "#2A2140", text2: "#6B6880", colors: ["#7C3AED", "#EC4899", "#22D3EE", "#FACC15"], acc: 3 },
  { n: "柔和底色＋鮮明重點（4 色）", bg: "#FAF8F5", text: "#2F2F2F", text2: "#6E6A66", colors: ["#3A7CA5", "#81B29A", "#F2CC8F", "#E07A5F"], acc: 3 },
  { n: "深色背景・亮色點綴", bg: "#0F1B2D", text: "#F2F5F9", text2: "#A9B4C2", colors: ["#3B82F6", "#22D3EE", "#FACC15"], acc: 2 }
];


/* ---------------- 投影片模擬（只用基本圖形，四種形狀語言） ---------------- */
function T(x, y, txt, size, fill, w = 700, anchor = "start", fam) {
  const f = fam || fontOf().b;
  return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${anchor}" style="font-family:${f}">${txt}</text>`; }
const TT = (x, y, txt, size, fill, w = 700, anchor = "start") => T(x, y, txt, size, fill, w, anchor, fontOf().t);

function badge(st, cx, cy, r, fill, label, c) {
  const fg = bestText(fill);
  const shape = st === "round" ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"/>`
    : st === "block" ? `<rect x="${cx - r}" y="${cy - r}" width="${r * 2}" height="${r * 2}" fill="${fill}"/>`
    : st === "slant" ? `<polygon points="${cx - r + 6},${cy - r} ${cx + r + 6},${cy - r} ${cx + r - 6},${cy + r} ${cx - r - 6},${cy + r}" fill="${fill}"/>`
    : `<rect x="${cx - r}" y="${cy + r - 3}" width="${r * 2}" height="3" fill="${fill}"/>`;
  return shape + T(cx, cy + 5, label, 14, st === "line" ? readable(fill, c.bg) : fg, 700, "middle");
}

function slide(type, c, st = ST.shape) {
  const W = 640, H = 360; let g = `<rect width="${W}" height="${H}" fill="${c.bg}"/>`;
  const onMain = bestText(c.main);
  const cols = c.colors || [c.main, c.sub, c.accent], multi = cols.length >= 4;   // 4 色以上：每章一色
  const chap = i => multi ? cols[i % cols.length] : null;
  const secC = multi ? chap(2) : c.main, onSec = bestText(secC);
  if (type === "cover" || type === "end") {
    const t1 = type === "cover" ? "動感生活健身俱樂部" : "感謝聆聽", t2 = type === "cover" ? "會員忠誠度提升行銷策略" : "敬請指教";
    if (st === "slant") g += `<polygon points="0,0 380,0 300,${H} 0,${H}" fill="${c.main}"/><polygon points="380,0 410,0 330,${H} 300,${H}" fill="${c.accent}"/>
      <circle cx="560" cy="80" r="70" fill="${c.sub}" opacity=".25"/>`;
    if (st === "round") g += `<circle cx="130" cy="180" r="270" fill="${c.main}"/><circle cx="520" cy="300" r="110" fill="${c.sub}" opacity=".35"/><circle cx="430" cy="70" r="22" fill="${c.accent}"/>`;
    if (st === "block") g += `<rect width="390" height="${H}" fill="${c.main}"/><rect x="410" y="20" width="210" height="150" fill="${c.sub}"/>
      <rect x="410" y="190" width="100" height="150" fill="${c.soft}"/><rect x="520" y="190" width="100" height="150" fill="${c.accent}"/>`;
    if (st === "line") g += `<rect x="40" y="40" width="560" height="2" fill="${c.main}"/><rect x="40" y="318" width="560" height="2" fill="${c.main}"/>
      <rect x="40" y="118" width="8" height="90" fill="${c.accent}"/>`;
    const tc = st === "line" ? readable(c.main, c.bg) : onMain, x = st === "line" ? 66 : 40;
    g += TT(x, 160, t1, 30, tc) + T(x, 198, t2, 18, st === "line" ? c.ink : onMain, 500);
    if (st !== "line") g += `<rect x="${x}" y="215" width="60" height="5" fill="${c.accent}"/>`;
    if (type === "cover") g += T(x, 300, "區域營運部｜董事會簡報", 12, st === "line" ? c.gray : onMain, 400);
  } else if (type === "toc") {
    const items = ["公司簡介", "市場現況", "客群分析", "行銷方案", "預算與效益"];

function checks(c) {
  c = normPal({ ...P, ...c });
  const rows = [["背景＋主文字", contrast(c.bg, c.text), 4.5], ["背景＋次要文字", contrast(c.bg, c.text2), 4.5]];
  c.colors.forEach((h, i) => rows.push([`${colorName(i, c)}當小標題字`, contrast(c.bg, h), 3]));
  rows.push(["主色色塊上的文字", Math.max(contrast(c.main, "#FFFFFF"), contrast(c.main, c.text), contrast(c.main, c.bg)), 4.5]);
  return rows.map(([n, r, need]) => `<div class="ck"><span>${n}</span><b class="${r >= need ? "good" : "warn"}">${r.toFixed(1)} ${r >= need ? "✓" : "✗"}</b></div>`).join("")
    + (() => { const hot = c.colors.filter(h => { const [, sa, l] = rgb2hsl(hex2rgb(h)); return sa > .9 && l > .4 && l < .65; });
        const dull = c.colors.filter(h => { const [, sa] = rgb2hsl(hex2rgb(h)); return sa < .3; });
        const dullHtml = dull.length >= Math.ceil(c.colors.length / 2) ? `<div class="ck"><span>偏灰的顏色太多：${dull.join("、")}</span><b class="warn">△</b></div><p class="muted small" style="margin:2px 0 0">整體太灰會沉悶、不吸睛，比賽建議主色與強調色選鮮明一點的顏色。</p>` : "";
        return dullHtml + (hot.length ? `<div class="ck"><span>高彩度純色：${hot.join("、")}</span><b class="warn">△</b></div><p class="muted small" style="margin:2px 0 0">接近純色、很刺眼，只適合小面積點綴；大面積使用時建議降一點彩度或明度。</p>` : ""); })()
    + `<p class="muted small" style="margin:6px 0 0">標 ✗ 的物件色不適合當文字，只用在色塊與圖形。</p>`;
}

const MODES = [
  { k: "free", n: "自由搭配", d: "每個點都可以自己拖" },
  { k: "mono", n: "同色系", d: "同一色相，只改深淺" },
  { k: "analog", n: "類似色", d: "主色左右每隔 30°" },
  { k: "comp", n: "互補色", d: "主色＋對面 180°" },
  { k: "split", n: "分裂互補", d: "對面左右各 30°" },
  { k: "even", n: "均分色環", d: "三角／四方／五等分，適合每章一色" }
];
const OFFS = {
  analog: { 2: [0, 30], 3: [0, -30, 30], 4: [0, -30, 30, 60], 5: [0, -30, 30, -60, 60], 6: [0, -30, 30, -60, 60, 90] },
  comp: { 2: [0, 180], 3: [0, 180, 200], 4: [0, 180, 20, 200], 5: [0, 180, 20, 200, -20], 6: [0, 180, 20, 200, -20, 160] },
  split: { 2: [0, 150], 3: [0, 150, 210], 4: [0, 150, 210, 30], 5: [0, 150, 210, 30, -30], 6: [0, 150, 210, 30, -30, 180] },
  even: { 2: [0, 180], 3: [0, 120, 240], 4: [0, 90, 180, 270], 5: [0, 72, 144, 216, 288], 6: [0, 60, 120, 180, 240, 300] }
};
const ptHex = p => hsl2hex(p.h, p.s, p.l);
const toPt = h => { const [a, b, l] = rgb2hsl(hex2rgb(h)); return { h: a, s: b, l }; };
let WH = store("bp_wheel2");
function syncWheel() { if (!WH || !Array.isArray(WH.pts)) WH = { mode: "free", sel: 0, acc: P.acc, pts: P.colors.map(toPt) }; }
function setCount(n) {
  while (WH.pts.length < n) { const m = WH.pts[0]; WH.pts.push({ h: (m.h + 72 * WH.pts.length) % 360, s: Math.max(m.s, .75), l: .55 }); }
  WH.pts.length = n; if (WH.sel >= n) WH.sel = 0; if (WH.acc >= n) WH.acc = n - 1;
}
function applyMode() {
  const m = WH.pts[0], n = WH.pts.length, r = WH.mode;
  if (r === "free") return;
  if (r === "mono") { const ls = [m.l, Math.min(.85, m.l + .22), Math.max(.18, m.l - .18), Math.min(.92, m.l + .36), Math.max(.12, m.l - .3), Math.min(.95, m.l + .45)];
    WH.pts.forEach((p, i) => { if (i) { p.h = m.h; p.s = m.s; p.l = ls[i]; } }); return; }
  const off = OFFS[r][n];
  WH.pts.forEach((p, i) => { if (i) { p.h = (m.h + off[i] + 360) % 360; p.s = Math.min(Math.max(p.s, .6), .75); if (p.l < .35 || p.l > .65) p.l = .53;
    if (p.h > 260 && p.h < 335) { p.s = Math.min(p.s, .5); }            // 紫、洋紅特別搶眼：降彩度
    if (p.h > 65 && p.h < 100) { p.h = p.h < 82 ? 50 : 125; }          // 黃綠容易髒：往黃或綠靠
  } });
}
const wHexes = () => WH.pts.map(ptHex);
const wLabel = i => i === 0 ? "主" : i === WH.acc ? "強" : String(i + 1);

function wheel() {
  syncWheel(); applyMode();
  const R = 140;
  const pos = p => [R + Math.sin(p.h * Math.PI / 180) * p.s * R, R - Math.cos(p.h * Math.PI / 180) * p.s * R];
  const cur = WH.pts[WH.sel], hexes = wHexes();
  const tmp = derived({ ...P, colors: hexes, acc: WH.acc });
  $("#body").innerHTML = `<div class="layout">
    <div><div class="card"><h2>色環</h2>
      <label style="margin-top:0">物件色彩要幾色？</label>
      <div class="row">${[3, 4, 5].map(n => `<button data-cnt="${n}" class="${WH.pts.length === n ? "primary" : ""}">${n} 色</button>`).join("")}</div>
      <div class="wheel" id="wheel" style="width:${R * 2}px;height:${R * 2}px;margin-top:12px">
        <svg width="${R * 2}" height="${R * 2}" style="position:absolute;inset:0">${WH.pts.map(p => { const [x, y] = pos(p);
          return `<line x1="${R}" y1="${R}" x2="${x}" y2="${y}" stroke="#fff" stroke-width="1.5" opacity=".8"/>`; }).join("")}</svg>
        ${WH.pts.map((p, i) => { const [x, y] = pos(p);
          return `<span class="hd ${i === WH.sel ? "on" : ""}" data-k="${i}" style="left:${x}px;top:${y}px;background:${hexes[i]};color:${bestText(hexes[i])}">${wLabel(i)}</span>`; }).join("")}
      </div>
      <p class="muted small center">拖曳圓點換色相（角度）和飽和度（離中心遠近）</p>
      <label>正在調整：${i18(WH.sel)}　明度（深淺）</label>
      <input type="range" id="lv" min="10" max="90" value="${Math.round(cur.l * 100)}">
      <label>配色規則</label>
      <div class="modes">${MODES.map(m => `<button data-m="${m.k}" class="${WH.mode === m.k ? "on" : ""}"><b>${m.n}</b><div class="muted small">${m.d}</div></button>`).join("")}</div>
    </div>
    <div class="card"><h2>配色方案參考</h2><p class="muted small">點一下就帶進色環，再依題目與自己的喜好調整。這些只是起點。</p>
      <div class="presets" style="grid-template-columns:1fr">${PRESETS.map((p, i) =>
        `<button class="preset" data-p="${i}">${swatches(palAll(p), true)}<b>${p.n}</b></button>`).join("")}</div></div></div>
    <div>
      <div class="card"><h2>這組配色</h2>
        <h3 style="margin-top:0">物件色彩（${hexes.length} 色）　<span class="muted small">點選哪一個當強調色</span></h3>
        <div class="objcols">${hexes.map((h, i) => `<label class="objc ${i === WH.acc ? "on" : ""}"><div class="bigsw" style="background:${h}"></div>
          <input type="radio" name="wacc" value="${i}" ${i === WH.acc ? "checked" : ""} style="width:auto"> <b>${i === 0 ? "主色" : i === WH.acc ? "強調色" : "色彩 " + (i + 1)}</b><div class="muted small">${h}</div></label>`).join("")}</div>
        <h3>背景與文字（白、黑、灰也是顏色）</h3>
        <div class="grid3">${["bg", "text", "text2"].map(k => `<div class="pick-row" style="grid-template-columns:46px 1fr"><span class="lab">${{ bg: "背景色", text: "主文字色", text2: "次要文字色" }[k]}</span><input type="color" data-n="${k}" value="${P[k]}"><input data-nh="${k}" value="${P[k]}" maxlength="7"></div>`).join("")}</div>
        <h3>可讀性檢查</h3>${checks({ colors: hexes, acc: WH.acc })}
        <p class="row"><button class="primary" id="toStyle">套用到母片風格</button><button id="saveW">存到我的色票</button></p></div>
      <div class="card"><h2>即時預覽 <span class="muted small">（只是參考，母片版面請自己設計）</span></h2><div class="slides">
        ${["cover", "toc", "section", "content"].map(t => `<div class="slide">${slide(t, tmp)}</div>`).join("")}</div></div>
    </div></div>`;

  const el = $("#wheel"), box = () => el.getBoundingClientRect();
  let drag = null;
  $$(".hd").forEach(h => h.onpointerdown = e => {
    const k = +h.dataset.k;
    if (WH.mode !== "free" && k !== 0) { WH.mode = "free"; toast("已切換成自由搭配"); }
    WH.sel = k; drag = k; e.preventDefault(); el.setPointerCapture && el.setPointerCapture(e.pointerId);
  });
  el.onpointermove = e => { if (drag === null) return; const b = box(); const dx = e.clientX - b.left - R, dy = e.clientY - b.top - R;
    const p = WH.pts[drag]; p.h = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360; p.s = Math.min(1, Math.hypot(dx, dy) / R);
    store("bp_wheel2", WH); wheelLater(); };
  el.onpointerup = el.onpointerleave = () => { if (drag !== null) { drag = null; wheel(); } };
  $("#lv").oninput = e => { cur.l = e.target.value / 100; store("bp_wheel2", WH); wheelLater(); };
  $("#lv").onchange = () => wheel();
  $$("[data-p]").forEach(b => b.onclick = () => { const p = normPal(PRESETS[b.dataset.p]);
    P = { ...P, bg: p.bg, text: p.text, text2: p.text2, colors: p.colors, acc: p.acc }; savePal();
    WH = { mode: "free", sel: 0, acc: p.acc, pts: p.colors.map(toPt) }; store("bp_wheel2", WH);
    wheel(); window.scrollTo({ top: 0, behavior: "smooth" }); toast("已套用：" + PRESETS[b.dataset.p].n); });
  $$("[data-cnt]").forEach(b => b.onclick = () => { setCount(+b.dataset.cnt); if (WH.mode === "mono" || WH.mode === "free") {} store("bp_wheel2", WH); wheel(); });
  $$("[data-m]").forEach(b => b.onclick = () => { WH.mode = b.dataset.m; WH.sel = 0; store("bp_wheel2", WH); wheel(); });
  $$("[name=wacc]").forEach(r => r.onchange = () => { WH.acc = +r.value; store("bp_wheel2", WH); wheel(); });
  $$("[data-n]").forEach(x => x.onchange = () => { P[x.dataset.n] = x.value.toUpperCase(); savePal(); wheel(); });
  $$("[data-nh]").forEach(x => x.onchange = () => { let v = x.value.trim(); if (!v.startsWith("#")) v = "#" + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { P[x.dataset.nh] = v.toUpperCase(); savePal(); wheel(); } else toast("色碼格式：#RRGGBB", true); });
  $("#toStyle").onclick = () => { P = { ...P, colors: wHexes(), acc: WH.acc }; savePal(); TAB = "style"; render(); window.scrollTo(0, 0); toast("已套用"); };
  $("#saveW").onclick = () => { const name = prompt("色票名稱", "色環配色 " + (SAVED.length + 1)); if (name === null) return;
    SAVED.push({ name, ...normPal({ ...P, colors: wHexes(), acc: WH.acc }), at: new Date().toLocaleDateString("sv-SE") }); store("bp_palettes", SAVED); toast("已存到我的色票"); };
}
const i18 = i => i === 0 ? "主色" : i === WH.acc ? "強調色" : "色彩 " + (i + 1);
let wheelH; function wheelLater() { cancelAnimationFrame(wheelH); wheelH = requestAnimationFrame(() => {
  const R = 140; applyMode();
  const P2 = p => [R + Math.sin(p.h * Math.PI / 180) * p.s * R, R - Math.cos(p.h * Math.PI / 180) * p.s * R];
  $$(".hd").forEach(h => { const p = WH.pts[+h.dataset.k], [x, y] = P2(p); h.style.left = x + "px"; h.style.top = y + "px"; h.style.background = ptHex(p); });
  $$("#wheel line").forEach((ln, i) => { const [x, y] = P2(WH.pts[i]); ln.setAttribute("x2", x); ln.setAttribute("y2", y); });
  $$(".objc .bigsw").forEach((b, i) => b.style.background = ptHex(WH.pts[i]));
}); }

const slotGet = k => k[0] === "c" ? P.colors[+k.slice(1)] : P[k];
function slotSet(k, hex) { if (k[0] === "c") P.colors[+k.slice(1)] = hex; else P[k] = hex; savePal(); }
function slotOrder() { return [...P.colors.map((_, i) => "c" + i), "bg", "text", "text2"]; }
function shrink(file, max = 900) {
  return new Promise(ok => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
    const s = Math.min(1, max / Math.max(im.width, im.height)); const cv = document.createElement("canvas");
    cv.width = im.width * s; cv.height = im.height * s; cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
    ok(cv.toDataURL("image/jpeg", .82)); }; im.src = r.result; }; r.readAsDataURL(file); });
}
function dominant(cv, n = 10) {
  const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data, cnt = {};
  const step = Math.max(1, Math.floor(d.length / 4 / 40000)) * 4;
  for (let i = 0; i < d.length; i += step) { const k = (d[i] >> 4) + "," + (d[i + 1] >> 4) + "," + (d[i + 2] >> 4); cnt[k] = (cnt[k] || 0) + 1; }
  const out = [];
  for (const [k] of Object.entries(cnt).sort((a, b) => b[1] - a[1])) {
    const rgb = k.split(",").map(v => +v * 16 + 8);
    if (out.every(o => Math.hypot(...o.map((v, i) => v - rgb[i])) > 48)) out.push(rgb);
    if (out.length >= n) break;
  }
  return out.map(rgb2hex);
}

    </div>
    <div><div class="card"><h2>② 吸色組出配色方案</h2>
      <p class="muted small" style="margin-top:0">先點一個格子，再到左邊圖片上點顏色。</p>
      <h3>物件色彩（${P.colors.length} 色）</h3>
      <div class="slots">${P.colors.map((h, i) => `<button class="slot ${SLOT === "c" + i ? "on" : ""}" data-slot="c${i}"><i style="background:${h}"></i><b>${colorName(i)}</b><span>${h}</span></button>`).join("")}
        ${P.colors.length < 6 ? `<button class="slot add" id="addSlot">＋ 加一色</button>` : ""}</div>
      <p class="small" style="margin:6px 0">強調色是：<select id="accSel" style="width:auto">${P.colors.map((_, i) => `<option value="${i}" ${i === P.acc ? "selected" : ""}>${i === 0 ? "主色" : "色彩 " + (i + 1)}</option>`).join("")}</select>
        ${P.colors.length > 3 ? `<button class="small" id="delSlot" style="padding:2px 8px;margin-left:6px">刪掉最後一色</button>` : ""}</p>
      <h3>背景與文字色</h3>
      <div class="slots">${["bg", "text", "text2"].map(k => `<button class="slot ${SLOT === k ? "on" : ""}" data-slot="${k}"><i style="background:${P[k]}"></i><b>${SLOT_NAME(k)}</b><span>${P[k]}</span></button>`).join("")}</div>
      <h3>可讀性檢查</h3><div id="ckBox">${checks(c)}</div></div>
      <div class="card"><h2>預覽 <span class="muted small">（只是參考）</span></h2><div class="slides" id="slideBox">${["cover", "content"].map(t => `<div class="slide">${slide(t, c)}</div>`).join("")}</div>
      <p><button class="primary big" id="nextStep" style="width:100%">確定這組顏色，下一步：形狀與字型 →</button></p></div></div>
  </div>`;

  $("#inspFile").onchange = async e => { const f = e.target.files[0]; if (!f) return;
    const u = await shrink(f); INSP.push(u); if (INSP.length > 3) INSP.shift(); INSP_I = INSP.length - 1;
    try { store("bp_insp", INSP); } catch (er) {} insp(); toast("已載入，點圖片就能吸色"); };
  $$("[data-ii]").forEach(t => t.onclick = () => { INSP_I = +t.dataset.ii; insp(); });
  $$("[data-slot]").forEach(b => b.onclick = () => { SLOT = b.dataset.slot; insp(); });
  if ($("#addSlot")) $("#addSlot").onclick = () => { P.colors.push(vivid(P.colors[0], 72 * P.colors.length)); savePal(); SLOT = "c" + (P.colors.length - 1); insp(); };
  if ($("#delSlot")) $("#delSlot").onclick = () => { P.colors.pop(); if (P.acc >= P.colors.length) P.acc = P.colors.length - 1; savePal(); SLOT = "c0"; insp(); };
  $("#accSel").onchange = e => { P.acc = +e.target.value; savePal(); insp(); };
  $("#nextStep").onclick = () => { ST.picked = true; store("bp_style", ST); TAB = "style"; render(); window.scrollTo(0, 0); toast("配色已套用到母片風格"); };
  const fill = hex => { slotSet(SLOT, hex.toUpperCase()); const o = slotOrder(); SLOT = o[(o.indexOf(SLOT) + 1) % o.length]; insp(); };
  if (!img) return;
  const cv = $("#ic"), ctx = cv.getContext("2d"), im = new Image();
  im.onload = () => { cv.width = im.width; cv.height = im.height; ctx.drawImage(im, 0, 0);
    $("#dom").innerHTML = dominant(cv).map(h => `<button class="domsw" data-h="${h}" title="${h}" style="background:${h}"></button>`).join("");
    $$(".domsw").forEach(b => b.onclick = () => fill(b.dataset.h)); };
  im.src = img;
  const at = e => { const r = cv.getBoundingClientRect(); const x = Math.floor((e.clientX - r.left) * cv.width / r.width), y = Math.floor((e.clientY - r.top) * cv.height / r.height);
    const d = ctx.getImageData(Math.max(0, Math.min(cv.width - 1, x)), Math.max(0, Math.min(cv.height - 1, y)), 1, 1).data; return [rgb2hex([d[0], d[1], d[2]]), e.clientX - r.left, e.clientY - r.top]; };
  cv.onmousemove = e => { const [h, x, y] = at(e); const L = $("#loupe"); L.style.display = "block"; L.style.left = x + 16 + "px"; L.style.top = y - 46 + "px"; L.style.background = h; L.textContent = h; L.style.color = bestText(h); };
  cv.onmouseleave = () => $("#loupe").style.display = "none";
  cv.onclick = e => fill(at(e)[0]);
  if ($("#eyed")) $("#eyed").onclick = async () => { try { const r = await new EyeDropper().open(); fill(r.sRGBHex); } catch (er) {} };
  $("#inspNote").oninput = e => { const n = store("bp_insp_note") || {}; n[INSP_I] = e.target.value; store("bp_insp_note", n); };
  $("#inspDel").onclick = () => { if (!confirm("移除這張靈感圖？")) return; INSP.splice(INSP_I, 1); INSP_I = 0; store("bp_insp", INSP); insp(); };
  $("#inspSend").onclick = async () => { $("#inspSend").disabled = true; $("#inspSend").textContent = "上傳中…";
    const r = await api("submit", { ...ME, type: "style", drillCode: "S01", drillName: "母片靈感收集", seconds: 0, reflection: $("#inspNote").value,
      file: { name: "inspiration.jpg", type: "image/jpeg", data: img.split(",")[1] } });
    $("#inspSend").disabled = false; $("#inspSend").textContent = "送給老師看";
    if (r.ok) { PROG = null; store("bp_prog", null); loadProg().then(stepper); } toast(r.ok ? "已送給老師" : r.msg, !r.ok); };
}

/* ---------------- 母片養成步驟（每一頁最上方） ---------------- */
function approved() { return (PROG || store("bp_prog") || []).some(l => l.drill === "D00" && l.status === "通過"); }
function stepState() {
  const L = PROG || store("bp_prog") || [];
  const d00 = L.filter(l => l.drill === "D00"), last00 = d00[d00.length - 1];
  const d01 = L.filter(l => l.drill === "D01"), last3 = d01.slice(-3);
  const ok5 = approved();
  const rcDone = (RC || []).filter(r => r.sec && !r.sec.startsWith("0.") && (r.item || "").trim() && r.item !== "畫面外色票圈").length >= 3;
  return [
    { k: "insp", n: "上傳靈感圖", ok: INSP.length > 0 || L.some(l => l.drill === "S01") },
    { k: "insp", n: "吸色定配色", ok: !!ST.picked },
    { k: "style", n: "形狀・字型・命名", ok: !!(ST.name && SAVED.some(s => s.shape)) },
    { k: "D00", n: "試做第一版母片", ok: d00.length > 0, sub: "不限時間，做完上傳" },
    { k: "D00", n: "老師確認通過", ok: ok5, sub: last00 ? (last00.status === "再修" ? "老師請你再修" : last00.status === "通過" ? "" : "等老師看") : "" },
    { k: "recipe", n: "寫母片製作清單", ok: ok5 && rcDone, lock: !ok5 },
    { k: "D01", n: "30 分鐘內重建 ×3", ok: ok5 && last3.length === 3 && last3.every(l => l.seconds <= 1800), lock: !ok5,
      sub: ok5 && last3.length ? last3.map(l => fmtSec(l.seconds)).join("、") : "" }
  ];
}
function stepper() {
  const S = stepState(), next = S.findIndex(s => !s.ok);
  $("#steps").innerHTML = `<div class="stepbar">${S.map((s, i) => `<button class="sb ${s.ok ? "ok" : ""} ${i === next ? "now" : ""} ${s.k === TAB ? "here" : ""} ${s.lock ? "lock" : ""}" data-sk="${s.k}">
    <span class="sn">${s.ok ? "✓" : s.lock ? "🔒" : i + 1}</span><span class="st">${s.n}${i === next ? `<em class="nx">下一步</em>` : ""}${s.sub ? `<small>${esc(s.sub)}</small>` : ""}</span></button>`).join('<span class="sarr">›</span>')}</div>
    <p class="muted small" style="margin:6px 2px 0">藍框＝你現在所在的頁面　｜　🔒＝老師確認通過後才開放　｜　不知道怎麼配色？先看「色彩教學」或用「色環配色」找方向。</p>`;
  $$("[data-sk]").forEach(b => b.onclick = () => { const k = b.dataset.sk; if (k[0] === "D") return location.href = "index.html#go=" + k; TAB = k; render(); window.scrollTo(0, 0); });
}

/* ---------------- 畫面 ---------------- */
function render() {
  const tabs = [["insp", "靈感吸色"], ["style", "母片風格"], ["recipe", "母片製作清單"], ["mine", "我的色票"], ["learn", "色彩教學"], ["wheel", "色環配色"], ["shape", "圖形範例"]];
  $("#tabs").innerHTML = tabs.map(([k, n]) => `<button data-t="${k}" class="${TAB === k ? "on" : ""}">${n}</button>`).join("");
  $$("[data-t]").forEach(b => b.onclick = () => { TAB = b.dataset.t; render(); window.scrollTo(0, 0); });
  ({ insp, learn, wheel, style: styleTab, shape, mine, recipe })[TAB]();
  stepper();
}
if (["#insp", "#learn", "#wheel", "#style", "#shape", "#mine", "#recipe"].includes(location.hash)) TAB = location.hash.slice(1);
function loadLocal() {
  P = normPal(store("bp_palette") || { colors: ["#1F5BD8", "#38BDF8", "#E53935"], acc: 2 });
  ST = store("bp_style") || { name: "", shape: "slant", font: "jh" };
  SAVED = store("bp_palettes") || [];
  RC = store("bp_recipe") || defaultRecipe();
  WH = store("bp_wheel2");
}
(async () => {
  if (!ME) { location.replace("index.html"); return; }   // 沒登入就回首頁登入
  loadLocal(); render();                                    // 先用這台電腦的暫存立刻顯示
  const before = CLOUD_KEYS.map(k => localStorage.getItem(k)).join("|");
  let touched = false; const mark = e => { if (e.target.closest && e.target.closest("#body")) touched = true; };
  document.addEventListener("input", mark); document.addEventListener("click", mark);
  await cloudLoad();                                        // 背景向雲端拿最新
  const after = CLOUD_KEYS.map(k => localStorage.getItem(k)).join("|");
  if (after !== before && !touched) { loadLocal(); render(); }
  loadProg().then(() => stepper());
})();

</script>
</body>
